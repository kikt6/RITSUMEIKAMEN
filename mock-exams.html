<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#9d1717" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="立命館仮面浪人サークル" />
    <title>模試日程一覧 | 立命館仮面浪人サークル</title>
    <link rel="icon" type="image/png" href="./assets/ritsumeikan-kamen-logo.png" />
    <link rel="apple-touch-icon" href="./assets/ritsumeikan-kamen-logo.png" />
    <link rel="manifest" href="./site.webmanifest?v=20260923-1" />
    <link rel="stylesheet" href="./styles.css?v=20260923-1" />
  </head>
  <body>
    <main class="page mx-page">
      <header class="faq-hero mx-hero">
        <p class="eyebrow">MOCK EXAMS</p>
        <h1>模試日程一覧</h1>
        <p>河合塾・駿台・東進・代ゼミの年間模試をまとめて確認できます。大学名で絞り込んだり、受ける模試に★を付けて自分の日程表にできます（★はこの端末だけに保存）。</p>
        <div class="hero-link-row">
          <a class="source-link" href="./index.html">トップへ戻る</a>
        </div>
      </header>

      <section class="section mx-next" id="mxNext" aria-label="次の模試"></section>

      <section class="section mx-panel" aria-label="絞り込み">
        <label class="mx-search">
          <span class="mx-label">検索</span>
          <input id="mxSearch" type="search" inputmode="search" autocomplete="off" placeholder="大学名・模試名（例: 東京科学大、共通テスト）" />
        </label>
        <div class="mx-filter">
          <span class="mx-label">予備校</span>
          <div class="control-row mx-chips" id="mxProvider"></div>
        </div>
        <div class="mx-filter">
          <span class="mx-label">種別</span>
          <div class="control-row mx-chips" id="mxCategory"></div>
        </div>
        <div class="mx-toggles">
          <label class="mx-switch"><input type="checkbox" id="mxStarOnly" /><span>★を付けた模試だけ</span></label>
          <label class="mx-switch"><input type="checkbox" id="mxShowPast" /><span>終わった模試も表示</span></label>
        </div>
      </section>

      <section class="section mx-results" aria-label="模試一覧">
        <div class="mx-results__head">
          <p class="mock-exam__count" id="mxCount"></p>
          <button class="ghost-action mx-reset" type="button" id="mxReset">条件をリセット</button>
        </div>
        <nav class="mx-months" id="mxMonths" aria-label="月へ移動"></nav>
        <div id="mxList"></div>
      </section>

      <p class="mx-note">日程・受験料は各予備校の案内PDFをもとにしています。申込期間や会場は必ず各予備校の公式サイトで確認してください。</p>

      <footer class="site-footer">
        <p>バグ報告・アプリへの要望は、代表宛てDMまでよろしくお願いします。</p>
      </footer>
    </main>

    <script src="./exam-schedule.js?v=20260923-1"></script>
    <script src="./mock-exams.js?v=20260923-1"></script>
  </body>
</html>
