<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>立命館仮面浪人サークル</title>
    <link rel="icon" type="image/png" href="./assets/ritsumeikan-kamen-logo.png" />
    <link rel="apple-touch-icon" href="./assets/ritsumeikan-kamen-logo.png" />
    <link rel="stylesheet" href="./styles.css?v=20260507-2" />
  </head>
  <body>
    <main class="page">
      <nav class="side-tabs is-collapsed" id="sideTabs" aria-label="ページ内タブ">
        <button class="side-tabs__toggle" id="sideTabsToggle" type="button" aria-expanded="false" aria-label="タブを開く">
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </button>
        <div class="side-tabs__links">
          <a href="#librarySection">開館時間</a>
          <a href="#coopSection">営業時間</a>
          <a href="#mockExam">模試</a>
        </div>
      </nav>

      <header class="hero">
        <div class="hero__content">
          <p class="eyebrow" id="siteName">立命館仮面浪人サークル</p>
          <h1 id="pageTitle">立命館仮面浪人サークル</h1>
          <section class="hero-countdown" id="commonTestCountdown" aria-label="共通テスト開始までのカウントダウン">
            <div class="hero-countdown__title">
              <h2 id="commonTestTitle">共通テスト開始まで</h2>
              <p id="commonTestTarget"></p>
            </div>
            <div class="countdown-clock" aria-live="polite">
              <span><strong id="countdownDays">0</strong><small>日</small></span>
              <span><strong id="countdownHours">00</strong><small>時間</small></span>
              <span><strong id="countdownMinutes">00</strong><small>分</small></span>
              <span><strong id="countdownSeconds">00</strong><small>秒</small></span>
            </div>
          </section>
          <p class="lead" id="pageLead"></p>
          <div class="hero__meta">
            <span id="updatedAt"></span>
          </div>
        </div>
        <div class="hero__visual" aria-hidden="true">
          <img class="hero__logo" src="./assets/ritsumeikan-kamen-logo.png" alt="" />
        </div>
      </header>

      <section class="section notice-section">
        <div class="section__header">
          <h2>お知らせ</h2>
          <span id="noticeCount"></span>
        </div>
        <div class="notice-grid" id="notices"></div>
      </section>

      <section class="section library-hours" id="librarySection" aria-label="立命館大学図書館の開館時間">
        <div class="section__header section__header--stack">
          <div>
            <h2 id="libraryTitle">立命館大学 図書館開館時間</h2>
            <p id="libraryLead"></p>
          </div>
          <a class="source-link" id="librarySourceLink" href="https://www.ritsumei.ac.jp/lib/a03/010/" target="_blank" rel="noopener noreferrer">詳しく見る</a>
        </div>
        <div class="control-row" id="libraryMonthControls" aria-label="表示月の切り替え"></div>
        <div class="control-row campus-controls" id="libraryCampusControls" aria-label="図書館キャンパス切り替え"></div>
        <div class="library-grid" id="libraryCalendars"></div>
      </section>

      <section class="section coop-hours" id="coopSection" aria-label="立命館生協・学食の営業時間">
        <div class="section__header section__header--stack">
          <div>
            <h2 id="coopTitle">今日の学食・生協営業時間</h2>
            <p id="coopLead"></p>
          </div>
          <a class="source-link" id="coopSourceLink" href="https://www.ritsco-op.jp/schedule/schedule_202605.html" target="_blank" rel="noopener noreferrer">詳しく見る</a>
        </div>
        <div class="control-row campus-controls" id="coopCampusControls" aria-label="生協キャンパス切り替え"></div>
        <p class="coop-range" id="coopRange"></p>
        <div class="coop-table-wrap" id="coopHours"></div>
      </section>

      <section class="section mock-exam" id="mockExam" aria-label="次回模試日程"></section>
    </main>

    <script src="./content.js?v=20260507-2"></script>
    <script src="./exam-schedule.js?v=20260507-2"></script>
    <script src="./library-hours.js?v=20260507-2"></script>
    <script src="./coop-hours.js?v=20260507-2"></script>
    <script src="./script.js?v=20260507-2"></script>
  </body>
</html>
